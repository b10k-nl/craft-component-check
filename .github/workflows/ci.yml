name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  # Weekly, against the newest Craft and MCP SDK: there is no composer.lock,
  # so a Craft release that no longer fits (the MCP attributes, the
  # content-model check interface) turns this red before a client site meets it.
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

jobs:
  php:
    name: PHP tests & static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer check

  runner:
    name: Runner tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm test
